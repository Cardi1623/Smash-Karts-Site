<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smash Karts</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: linear-gradient(135deg, #090d25, #174b82);
}
main {
  padding: 35px 20px;
}
h1 {
  font-size: clamp(38px, 9vw, 70px);
  color: #35eaff;
  text-shadow: 3px 3px #763bff;
}
p {
  font-size: 20px;
}
a {
  display: inline-block;
  margin-top: 20px;
  padding: 18px 40px;
  border-radius: 12px;
  background: #35eaff;
  color: #081124;
  text-decoration: none;
  font-size: 24px;
  font-weight: bold;
}
a:hover {
  background: white;
  transform: scale(1.05);
}
</style>
</head>
<body>
<main>
  <h1>SMASH KARTS</h1>
  <p>🏎️ Ready to race?</p>
  <p>Enter the arena and start playing!</p>
  <a href="https://smashkarts.io/" target="_blank"
     rel="noopener noreferrer">▶ PLAY NOW</a>
</main>
</body>
</html>
